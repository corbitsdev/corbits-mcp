name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:e2e
      - name: node consumer smoke
        run: |
          set -euo pipefail
          TARBALL="$PWD/$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/neutral" && cd "$RUNNER_TEMP/neutral"
          npm init -y >/dev/null && npm pkg set type=module >/dev/null
          npm install "$TARBALL"
          node -e 'import("@corbits/mcp/client").then((m) => { for (const n of ["mcpInitialize", "mcpListTools", "mcpCallTool"]) if (typeof m[n] !== "function") throw new Error("missing export: " + n); })'
          mkdir -p "$RUNNER_TEMP/host" && cd "$RUNNER_TEMP/host"
          npm init -y >/dev/null && npm pkg set type=module >/dev/null
          npm install "$TARBALL" @intx/agent@0.5.0 @intx/harness@0.5.0 @corbits/oauth-core@0.3.3
          node -e 'import("@corbits/mcp").then((m) => { for (const n of ["mcpTools", "mcpInitialize", "mcpListTools", "mcpCallTool"]) if (typeof m[n] !== "function") throw new Error("missing export: " + n); })'
